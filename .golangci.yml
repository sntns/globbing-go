version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - godot
    - gosec
    - misspell
    - nolintlint
    - predeclared
    - revive
    - unconvert
    - unparam
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: receiver-naming
        - name: unexported-return
        - name: blank-imports
        - name: context-as-argument
        - name: increment-decrement
        - name: range
        - name: time-naming
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sntns/globbing-go
