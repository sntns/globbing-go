name: Feature request
description: Suggest a change to the API or the matching behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: If it touches the API, sketch the signatures you have in mind.

  - type: checkboxes
    id: conformance
    attributes:
      label: Conformance
      options:
        - label: The behaviour I am asking for is what git itself does.
        - label: I checked with `git check-ignore` before opening this.
